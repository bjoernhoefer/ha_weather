services:
  ha_weather:
    image: ghcr.io/bjoernhoefer/ha_weather:latest
    container_name: ha_weather
    restart: unless-stopped
    labels:
      # GitHub Actions deploys updates; the host's unfiltered Watchtower must not also update this container.
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "6070:8080"
    environment:
      HAW_DEPLOYMENT_MODE: ${HAW_DEPLOYMENT_MODE:-local}
      HAW_API_KEYS: ${HAW_API_KEYS:-}
      HAW_OPENWEATHERMAP_API_KEY: ${HAW_OPENWEATHERMAP_API_KEY:-}
      HAW_WEATHERAPI_API_KEY: ${HAW_WEATHERAPI_API_KEY:-}
      HAW_AEMET_API_KEY: ${HAW_AEMET_API_KEY:-}
      HAW_AZURE_FOUNDRY_ENDPOINT: ${HAW_AZURE_FOUNDRY_ENDPOINT:-}
      HAW_AZURE_FOUNDRY_API_KEY: ${HAW_AZURE_FOUNDRY_API_KEY:-}
      HAW_AZURE_FOUNDRY_DEPLOYMENT: ${HAW_AZURE_FOUNDRY_DEPLOYMENT:-gpt-4o-mini}
    volumes:
      - ha_weather_data:/data

volumes:
  ha_weather_data:
